name: Build
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test and build macOS ARM64
        run: bash scripts/build-macos.sh
      - name: Check supervisor without locking input
        run: python3 scripts/test-watchdog.py dist/KeyPossum.app/Contents/MacOS/KeyPossum
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPossum-macos-arm64
          path: |
            dist/*-macos-arm64.zip
            dist/*-macos-arm64.dmg
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test and build Windows x64
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KeyPossum-windows-x64
          path: dist/*-windows-x64.zip
          if-no-files-found: error
